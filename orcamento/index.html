<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamentos — Distribuidora Pantanal</title>
<style>
  :root {
    --navy: #14213D;
    --navy-2: #1f3360;
    --yellow: #f5c518;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1b2333;
    --muted: #64708a;
    --line: #e2e6ee;
    --sel: #fff8dc;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }

  /* ---------- Cabeçalho e navegação ---------- */
  header { background: var(--navy); border-bottom: 4px solid var(--yellow); }
  .topo {
    max-width: 1280px; margin: 0 auto; padding: 12px 24px 0;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .topo img { height: 56px; display: block; background: #fff; padding: 6px 10px; border-radius: 8px; }
  .topo h1 { margin: 0; font-size: 20px; color: #fff; font-weight: 600; }
  .topo .data { margin-left: auto; color: #c9d3ea; font-size: 14px; }
  nav { max-width: 1280px; margin: 0 auto; padding: 12px 24px 0; display: flex; gap: 6px; }
  nav a {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 8px 8px 0 0;
    color: #c9d3ea; text-decoration: none; font-weight: 600; background: rgba(255,255,255,.06);
  }
  nav a:hover { background: rgba(255,255,255,.12); color: #fff; }
  nav a.ativa { background: var(--bg); color: var(--navy); }
  nav .passo {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px;
    background: rgba(255,255,255,.15); color: #fff;
  }
  nav a.ativa .passo { background: var(--yellow); color: var(--navy); }
  nav .info { font-weight: 400; font-size: 13px; opacity: .85; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 40px; }
  .tela { display: grid; gap: 20px; align-items: start; }
  .tela-orcamento { grid-template-columns: minmax(0, 1fr) 400px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .card h2 { margin: 0; font-size: 16px; color: var(--navy); padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .card h2 .contagem { font-weight: 400; color: var(--muted); font-size: 14px; }

  /* ---------- Formulários ---------- */
  input, select { font: inherit; padding: 8px 10px; border: 1px solid #c9d0dd; border-radius: 6px; background: #fff; color: var(--text); }
  .campo { display: grid; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .campo input, .campo select { width: 100%; font-size: 15px; font-weight: 400; }
  .filtros { display: flex; gap: 10px; padding: 12px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); align-items: center; }
  .filtros input[type=search] { flex: 1 1 220px; }
  .filtros label { white-space: nowrap; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }

  /* ---------- Tabelas ---------- */
  .tabela-wrap { max-height: calc(100vh - 330px); min-height: 200px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: #f8f9fc; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); z-index: 1; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.cod { color: var(--muted); font-variant-numeric: tabular-nums; width: 50px; }
  td.fraco { color: var(--muted); font-size: 13px; }
  tr.selecionado td { background: var(--sel); }
  tr.cat-titulo td { background: var(--navy); color: #fff; font-weight: 600; font-size: 13px; padding: 6px 12px; }
  #listaClientes tr { cursor: pointer; }
  #listaClientes tr:hover td { background: #f4f7ff; }
  #listaClientes tr.selecionado:hover td { background: var(--sel); }
  .vazio { padding: 24px 16px; color: var(--muted); text-align: center; }

  .qtd { display: inline-flex; align-items: center; border: 1px solid #c9d0dd; border-radius: 6px; overflow: hidden; background: #fff; }
  .qtd button { border: 0; background: #eef1f6; width: 30px; height: 32px; font-size: 18px; cursor: pointer; color: var(--navy); }
  .qtd button:hover { background: #dfe4ee; }
  .qtd input { width: 56px; height: 32px; border: 0; border-radius: 0; padding: 0; text-align: center; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  .qtd input::-webkit-outer-spin-button, .qtd input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* ---------- Botões ---------- */
  .btn { font: inherit; padding: 9px 14px; border-radius: 6px; cursor: pointer; border: 1px solid var(--navy); background: #fff; color: var(--navy); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .btn.primario { background: var(--yellow); border-color: var(--yellow); color: var(--navy); }
  .btn.escuro { background: var(--navy); color: #fff; }
  .btn.pequeno { padding: 5px 10px; font-size: 13px; }
  .btn:hover { filter: brightness(.95); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .link { border: 0; background: none; padding: 0; color: var(--navy-2); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; }

  /* ---------- Tela Clientes ---------- */
  .escolhido { display: flex; align-items: center; gap: 16px; padding: 14px 16px; flex-wrap: wrap; }
  .escolhido .nome { font-size: 18px; font-weight: 700; color: var(--navy); }
  .escolhido .sub { color: var(--muted); font-size: 14px; }
  .escolhido .acoes-linha { margin-left: auto; display: flex; gap: 8px; }
  .novo-cliente { display: grid; grid-template-columns: 2fr 1.4fr 90px auto; gap: 10px; align-items: end; padding: 14px 16px; }

  /* ---------- Barra de resumo (tela Produtos) ---------- */
  .barra {
    position: sticky; bottom: 0; z-index: 5; background: var(--navy); color: #fff; border-radius: 10px;
    padding: 12px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; box-shadow: 0 -4px 16px rgba(20,33,61,.18);
  }
  .barra .cli { font-weight: 600; }
  .barra .cli small, .barra .resumo-barra small { display: block; font-weight: 400; color: #c9d3ea; font-size: 12px; }
  .barra .resumo-barra { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
  .barra .resumo-barra strong { font-size: 22px; color: var(--yellow); }

  /* ---------- Tela Orçamento ---------- */
  aside.card { position: sticky; top: 16px; }
  .bloco { padding: 12px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .cidade-uf { display: grid; grid-template-columns: 1fr 76px; gap: 8px; }
  .resumo { padding: 12px 16px; display: grid; gap: 6px; }
  .resumo .linha { display: flex; justify-content: space-between; align-items: center; font-variant-numeric: tabular-nums; }
  .resumo small { color: var(--muted); font-size: 12px; }
  .frete-campo { display: inline-flex; align-items: center; gap: 6px; }
  .frete-campo input { width: 90px; padding: 4px 6px; text-align: right; }
  input.pendente { border-color: #d97706; background: #fff7e6; }
  .verde { color: #157347; }
  .dica { font-size: 12px; color: var(--navy-2); background: #eef3ff; border-radius: 6px; padding: 5px 8px; }
  .aviso { font-size: 12px; color: #8a4b00; background: #fff4dc; border-radius: 6px; padding: 5px 8px; }
  .total { background: var(--navy); color: #fff; padding: 18px 16px; display: flex; justify-content: space-between; align-items: baseline; }
  .total span:first-child { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; }
  .total strong { font-size: 40px; font-weight: 800; line-height: 1.1; color: var(--yellow); font-variant-numeric: tabular-nums; }
  .total small { display: block; font-size: 12px; color: #c9d3ea; text-transform: none; letter-spacing: 0; text-align: right; font-weight: 400; }
  .acoes { display: flex; gap: 8px; padding: 12px 16px; }
  .acoes .btn { flex: 1; }
  .remover { border: 0; background: none; color: #b33; cursor: pointer; font-size: 16px; padding: 0 4px; }

  .rodape { color: var(--muted); font-size: 12px; padding: 10px 16px; }
  .rodape label { color: var(--navy-2); text-decoration: underline; cursor: pointer; }

  /* Bloco usado só na impressão */
  #impressao { display: none; }

  @media screen and (max-width: 900px) {
    .topo { padding: 10px 16px 0; }
    .topo .data { margin-left: 0; width: 100%; }
    nav { padding: 10px 8px 0; gap: 4px; }
    nav a { flex: 1; flex-direction: column; gap: 2px; padding: 8px 4px; font-size: 13px; text-align: center; }
    nav .info { display: none; }
    main { padding: 16px; }
    .tela-orcamento { grid-template-columns: minmax(0, 1fr); }
    aside.card { position: static; }
    .tabela-wrap { max-height: none; }
    th, td { padding: 8px 6px; }
    .esconder-cel { display: none; }
    .filtros select { flex: 1 1 140px; }
    .qtd input { width: 44px; }
    .total strong { font-size: 34px; }
    .novo-cliente { grid-template-columns: 1fr 76px; }
    .novo-cliente .campo:first-child, .novo-cliente .btn { grid-column: 1 / -1; }
    .escolhido .acoes-linha { margin-left: 0; width: 100%; }
    .escolhido .acoes-linha .btn { flex: 1; }
    .barra { gap: 10px; flex-wrap: nowrap; padding: 10px 12px; }
    .barra .cli, .barra .resumo-barra small:last-child { display: none; }
    .barra .resumo-barra { margin-left: 0; text-align: left; }
    .barra .resumo-barra strong { font-size: 20px; }
    .barra .btn { margin-left: auto; }
  }

  @media print {
    body { background: #fff; }
    header, main { display: none !important; }
    #impressao { display: block; padding: 0 8px; font-size: 13px; }
    .cab-impressao { display: flex; align-items: center; gap: 16px; padding-bottom: 10px; border-bottom: 3px solid var(--yellow); }
    .cab-impressao img { height: 56px; }
    .cab-impressao .empresa { font-size: 24px; font-weight: 700; color: var(--navy); }
    .cab-impressao .subtitulo { font-size: 14px; color: #444; }
    #impressao table.dados { margin: 12px 0; }
    #impressao table.dados td { border: 0; padding: 3px 0; }
    #impressao .res td { border-bottom: 0; padding-top: 4px; padding-bottom: 4px; }
    #impressao .obs { color: #666; font-size: 11px; margin-top: 16px; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #impressao table th { position: static; background: #eee; color: #000; }
    #impressao .tot td { font-weight: 700; font-size: 15px; border-top: 2px solid #000; }
    @page { margin: 15mm; }
  }
</style>
</head>

<main>
  <!-- ================= TELA 1: CLIENTES ================= -->
  <section class="tela" id="tela-clientes" hidden>
    <div class="card">
      <h2>Cliente do orçamento</h2>
      <div class="escolhido" id="clienteEscolhido"></div>
    </div>

    <div class="card">
      <h2>Clientes cadastrados <span class="contagem" id="contagemClientes"></span></h2>
      <div class="filtros">
        <input type="search" id="buscaCliente" placeholder="Buscar por nome do cliente…" autocomplete="off">
        <select id="filtroCidade"><option value="">Todas as cidades</option></select>
        <select id="filtroSegmento"><option value="">Todos os segmentos</option></select>
      </div>
      <div class="tabela-wrap">
        <table>
          <thead><tr><th>Cliente</th><th>Cidade</th><th>UF</th><th class="esconder-cel">Segmento</th><th></th></tr></thead>
          <tbody id="listaClientes"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Cliente não cadastrado</h2>
      <form class="novo-cliente" id="formNovoCliente">
        <label class="campo">Nome do cliente <input type="text" id="novoNome" required></label>
        <label class="campo">Cidade <input type="text" id="novoCidade" list="listaCidades" autocomplete="off" required></label>
        <label class="campo">UF <select id="novoUf"></select></label>
        <button class="btn escuro" type="submit">Usar este cliente</button>
      </form>
    </div>
  </section>

  <!-- ================= TELA 2: PRODUTOS ================= -->
  <section class="tela" id="tela-produtos" hidden>
    <div class="card">
      <h2>Produtos <span class="contagem" id="infoLista"></span></h2>
      <div class="filtros">
        <input type="search" id="busca" placeholder="Buscar por nome ou código…" autocomplete="off">
        <select id="categoria"><option value="">Todas as categorias</option></select>
        <label><input type="checkbox" id="soSelecionados"> Só os escolhidos</label>
      </div>
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr><th class="esconder-cel">Cód.</th><th>Produto</th><th class="esconder-cel">Categoria</th><th class="num">Preço</th><th class="num">Quantidade</th><th class="num esconder-cel">Subtotal</th></tr>
          </thead>
          <tbody id="listaProdutos"></tbody>
        </table>
      </div>
      <div class="rodape">
        <label for="arquivoCsv">Carregar outro produtos.csv</label>
        <input type="file" id="arquivoCsv" accept=".csv,text/csv" hidden>
      </div>
    </div>

    <div class="barra">
      <div class="cli" id="barraCliente"></div>
      <div class="resumo-barra" id="barraResumo"></div>
      <a class="btn primario" href="#orcamento">Ver orçamento →</a>
    </div>
  </section>

  <!-- ================= TELA 3: ORÇAMENTO ================= -->
  <section class="tela tela-orcamento" id="tela-orcamento" hidden>
    <div class="card">
      <h2>Itens do orçamento <span class="contagem" id="qtdItens"></span></h2>
      <div id="itens"></div>
    </div>

    <aside class="card">
      <h2>Resumo</h2>
      <div class="bloco">
        <label class="campo">Cliente
          <input type="text" id="cliente" list="sugestoesClientes" placeholder="Escolha na tela Clientes ou digite" autocomplete="off">
        </label>
        <datalist id="sugestoesClientes"></datalist>
        <div class="cidade-uf">
          <label class="campo">Cidade
            <input type="text" id="cidade" list="listaCidades" placeholder="Cidade de entrega" autocomplete="off">
          </label>
          <label class="campo">UF <select id="uf"></select></label>
        </div>
        <datalist id="listaCidades"></datalist>
        <label class="campo">Vendedor <input type="text" id="vendedor" placeholder="Opcional"></label>
      </div>
      <div class="resumo">
        <div class="linha"><span>Subtotal dos produtos</span><span id="subtotal">R$ 0,00</span></div>
        <div class="linha" id="linhaDesconto" hidden><span id="rotuloDesconto">Desconto</span><span id="valorDesconto" class="verde"></span></div>
        <div class="dica" id="dicaDesconto" hidden></div>
        <div class="linha">
          <span>Frete <small id="origemFrete"></small></span>
          <span class="frete-campo">
            <button type="button" class="link" id="fretePadrao" hidden>usar padrão</button>
            R$ <input type="text" id="frete" inputmode="decimal" placeholder="—" aria-label="Valor do frete">
          </span>
        </div>
        <div class="aviso" id="avisoFrete" hidden></div>
      </div>
      <div class="total"><span>Total</span><strong id="total">R$ 0,00</strong></div>
      <div class="acoes">
        <button class="btn" id="novoOrcamento">Novo orçamento</button>
        <button class="btn primario" id="imprimir">Imprimir / Salvar PDF</button>
      </div>
    </aside>
  </section>
</main>

// ---------- Regras comerciais (altere aqui) ----------
// Desconto automático sobre o valor dos produtos (o frete não tem desconto).
// "acima de": o valor precisa ser MAIOR que o limite.
const FAIXAS_DESCONTO = [
  { acimaDe: 15000, pct: 10 },
  { acimaDe: 5000,  pct: 5 },
];
// Frete: grátis nessas cidades de MT; valor fixo nas demais cidades de MT.
// Fora de MT não há regra: o vendedor informa o valor.
const FRETE = { uf: 'MT', gratis: ['Cuiabá', 'Várzea Grande'], valorMT: 150 };
const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const CHAVE_RASCUNHO = 'pantanal-orcamento-rascunho';

const moeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = v => moeda.format(v);
const centavos = v => Math.round(v * 100) / 100;
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function semAcento(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }

// ---------- Leitura do CSV ----------
// Lê texto no formato "a;b;c" (com cabeçalho) e devolve objetos só com as colunas pedidas.
function lerTabela(texto, colunas) {
  const linhas = texto.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim() !== '');
  const cab = linhas.shift().split(';').map(c => c.trim().toLowerCase());
  const pos = colunas.map(c => cab.indexOf(c));
  if (pos.includes(-1)) throw new Error('O arquivo precisa ter as colunas: ' + colunas.join(';'));
  return linhas.map(l => {
    const c = l.split(';');
    return Object.fromEntries(colunas.map((nome, i) => [nome, (c[pos[i]] || '').trim()]));
  });
}
// "1.234,56" -> 1234.56
function numeroBR(s) { return parseFloat(String(s).trim().replace(/\./g, '').replace(',', '.')); }

function lerProdutos(texto) {
  return lerTabela(texto, ['codigo', 'produto', 'categoria', 'preco'])
    .map(p => ({ ...p, preco: numeroBR(p.preco) }))
    .filter(p => p.produto && !isNaN(p.preco));
}

// ---------- Dados e estado do orçamento ----------
const clientes = lerTabela(CSV_CLIENTES, ['codigo', 'cliente', 'cidade', 'uf', 'segmento']);
let produtos = [];

// Tudo o que forma o orçamento em andamento. É salvo no navegador para não se
// perder ao recarregar a página.
const estado = {
  clienteCodigo: null,    // código do cliente cadastrado escolhido (null = avulso/nenhum)
  cliente: '', cidade: '', uf: FRETE.uf, vendedor: '',
  freteManual: null,      // número digitado pelo vendedor, ou null para usar a regra
  quantidades: new Map(), // codigo do produto -> quantidade
};

function salvar() {
  try {
    localStorage.setItem(CHAVE_RASCUNHO, JSON.stringify({ ...estado, quantidades: [...estado.quantidades] }));
  } catch (e) { /* navegador sem armazenamento: segue sem salvar */ }
}
function restaurar() {
  try {
    const salvo = JSON.parse(localStorage.getItem(CHAVE_RASCUNHO) || 'null');
    if (!salvo) return;
    Object.assign(estado, salvo, { quantidades: new Map(salvo.quantidades || []) });
    // descarta produtos que não existem mais na lista
    for (const cod of estado.quantidades.keys()) if (!produtos.some(p => p.codigo === cod)) estado.quantidades.delete(cod);
  } catch (e) { /* rascunho inválido: começa do zero */ }
}

// Cidades conhecidas (do cadastro + as da regra de frete), com a UF de cada uma
const cidades = new Map();
FRETE.gratis.forEach(c => cidades.set(semAcento(c), { cidade: c, uf: FRETE.uf }));
clientes.forEach(c => cidades.set(semAcento(c.cidade), { cidade: c.cidade, uf: c.uf }));
const ufDaCidade = nome => (cidades.get(semAcento(nome)) || {}).uf;

// ---------- Cálculo ----------
function descontoPara(subtotal) {
  const faixa = FAIXAS_DESCONTO.find(f => subtotal > f.acimaDe);
  return faixa ? faixa.pct : 0;
}

// Devolve { valor, origem } — valor null quando não há regra (fora de MT ou sem cidade).
function fretePelaRegra() {
  const cidade = estado.cidade.trim(), uf = estado.uf;
  if (!cidade) return { valor: null, origem: 'informe a cidade' };
  if (uf !== FRETE.uf) return { valor: null, origem: `fora de ${FRETE.uf}` };
  if (FRETE.gratis.some(c => semAcento(c) === semAcento(cidade))) return { valor: 0, origem: 'grátis nesta cidade' };
  return { valor: FRETE.valorMT, origem: `padrão ${FRETE.uf}` };
}

function calcular() {
  const itens = produtos
    .filter(p => estado.quantidades.get(p.codigo) > 0)
    .map(p => ({ ...p, qtd: estado.quantidades.get(p.codigo), sub: centavos(estado.quantidades.get(p.codigo) * p.preco) }));
  const subtotal = centavos(itens.reduce((s, i) => s + i.sub, 0));
  const pct = descontoPara(subtotal);
  const desconto = centavos(subtotal * pct / 100);
  const regra = fretePelaRegra();
  const frete = estado.freteManual !== null ? estado.freteManual : regra.valor;   // null = a definir
  const total = centavos(subtotal - desconto + (frete || 0));
  const unidades = itens.reduce((s, i) => s + i.qtd, 0);
  return { itens, subtotal, pct, desconto, regra, frete, freteEditado: estado.freteManual !== null, total, unidades };
}

// ---------- Navegação entre as telas ----------
const TELAS = ['clientes', 'produtos', 'orcamento'];
function mostrarTela() {
  const tela = TELAS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'clientes';
  TELAS.forEach(t => { $('tela-' + t).hidden = t !== tela; });
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('ativa', a.dataset.tela === tela));
  if (tela === 'clientes') desenharClientes();
  if (tela === 'produtos') desenharProdutos();
  if (tela === 'orcamento') desenharOrcamento();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', mostrarTela);

// Atualiza o que aparece em todas as telas (abas, barra de resumo)
function atualizarResumos() {
  const o = calcular();
  $('navCliente').textContent = estado.cliente ? '· ' + estado.cliente : '';
  $('navProdutos').textContent = o.itens.length ? `· ${o.itens.length} escolhido(s)` : '';
  $('navTotal').textContent = o.itens.length ? '· ' + fmt(o.total) : '';

  $('barraCliente').innerHTML = estado.cliente
    ? `${esc(estado.cliente)}<small>${esc(estado.cidade || 'cidade não informada')}${estado.cidade ? ' - ' + esc(estado.uf) : ''}</small>`
    : `Nenhum cliente escolhido<small><a href="#clientes" style="color:#fff">escolher cliente</a></small>`;
  $('barraResumo').innerHTML = `<small>${o.itens.length} produto(s) · ${o.unidades} unid.${o.pct ? ` · desconto ${o.pct}%` : ''}</small>
    <strong>${fmt(o.subtotal - o.desconto)}</strong><small>em produtos${o.pct ? ', já com desconto' : ''}</small>`;
  salvar();
}

// ---------- TELA 1: CLIENTES ----------
function preencherSelect(sel, valores, rotuloTodos) {
  sel.innerHTML = `<option value="">${rotuloTodos}</option>` + valores.map(v => `<option>${esc(v)}</option>`).join('');
}
const ordenar = arr => [...new Set(arr)].sort((a, b) => a.localeCompare(b, 'pt-BR'));
preencherSelect($('filtroCidade'), ordenar(clientes.map(c => c.cidade)), 'Todas as cidades');
preencherSelect($('filtroSegmento'), ordenar(clientes.map(c => c.segmento)), 'Todos os segmentos');
['novoUf', 'uf'].forEach(id => { $(id).innerHTML = UFS.map(u => `<option${u === FRETE.uf ? ' selected' : ''}>${u}</option>`).join(''); });
$('listaCidades').innerHTML = [...cidades.values()]
  .sort((a, b) => a.cidade.localeCompare(b.cidade, 'pt-BR'))
  .map(c => `<option value="${esc(c.cidade)}">${esc(c.uf)}</option>`).join('');
$('sugestoesClientes').innerHTML = clientes
  .map(c => `<option value="${esc(c.cliente)}">${esc(c.cidade)} - ${esc(c.uf)}</option>`).join('');

function desenharClientes() {
  // Cliente escolhido
  const box = $('clienteEscolhido');
  if (estado.cliente) {
    const cad = clientes.find(c => c.codigo === estado.clienteCodigo);
    box.innerHTML = `<div><div class="nome">${esc(estado.cliente)}</div>
      <div class="sub">${esc(estado.cidade || 'cidade não informada')}${estado.cidade ? ' - ' + esc(estado.uf) : ''}${cad ? ' · ' + esc(cad.segmento) : ' · não cadastrado'}</div></div>
      <div class="acoes-linha"><button class="btn" id="trocarCliente">Trocar cliente</button><a class="btn primario" href="#produtos">Escolher produtos →</a></div>`;
    $('trocarCliente').onclick = () => { definirCliente(null); $('buscaCliente').focus(); };
  } else {
    box.innerHTML = `<div class="sub">Nenhum cliente escolhido. Clique em um cliente da lista abaixo ou informe um cliente não cadastrado.</div>
      <div class="acoes-linha"><a class="btn" href="#produtos">Pular e escolher produtos →</a></div>`;
  }

  // Lista
  const termo = semAcento($('buscaCliente').value);
  const cidade = $('filtroCidade').value, seg = $('filtroSegmento').value;
  const lista = clientes.filter(c =>
    (!termo || semAcento(c.cliente).includes(termo)) && (!cidade || c.cidade === cidade) && (!seg || c.segmento === seg));
  $('contagemClientes').textContent = `· ${lista.length} de ${clientes.length}`;
  $('listaClientes').innerHTML = lista.length ? lista.map(c => {
    const sel = c.codigo === estado.clienteCodigo;
    return `<tr data-cod="${esc(c.codigo)}" class="${sel ? 'selecionado' : ''}">
      <td>${esc(c.cliente)}</td><td>${esc(c.cidade)}</td><td>${esc(c.uf)}</td><td class="fraco esconder-cel">${esc(c.segmento)}</td>
      <td class="num">${sel ? '<b>✓ Escolhido</b>' : '<button class="btn pequeno" type="button">Escolher</button>'}</td></tr>`;
  }).join('') : '<tr><td colspan="5" class="vazio">Nenhum cliente encontrado.</td></tr>';
}

// cad = cliente do cadastro, objeto avulso { cliente, cidade, uf }, ou null para limpar
function definirCliente(cad) {
  estado.clienteCodigo = cad && cad.codigo ? cad.codigo : null;
  estado.cliente = cad ? cad.cliente : '';
  estado.cidade = cad ? cad.cidade : '';
  estado.uf = cad ? cad.uf : FRETE.uf;
  estado.freteManual = null;   // trocar de cliente/cidade volta à regra do frete
  atualizarResumos();
  desenharClientes();
}

$('listaClientes').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-cod]');
  if (!tr) return;
  definirCliente(clientes.find(c => c.codigo === tr.dataset.cod));
  location.hash = '#produtos';
});
['buscaCliente', 'filtroCidade', 'filtroSegmento'].forEach(id => $(id).addEventListener('input', desenharClientes));

$('novoCidade').addEventListener('input', () => { const uf = ufDaCidade($('novoCidade').value); if (uf) $('novoUf').value = uf; });
$('formNovoCliente').addEventListener('submit', e => {
  e.preventDefault();
  definirCliente({ cliente: $('novoNome').value.trim(), cidade: $('novoCidade').value.trim(), uf: $('novoUf').value });
  e.target.reset(); $('novoUf').value = FRETE.uf;
  location.hash = '#produtos';
});

// ---------- TELA 2: PRODUTOS ----------
function carregarProdutos(lista, origem) {
  produtos = lista;
  for (const cod of estado.quantidades.keys()) if (!produtos.some(p => p.codigo === cod)) estado.quantidades.delete(cod);
  preencherSelect($('categoria'), [...new Set(produtos.map(p => p.categoria))], 'Todas as categorias');
  $('infoLista').textContent = `· ${produtos.length} produtos (${origem})`;
  desenharProdutos();
  atualizarResumos();
}

function desenharProdutos() {
  const termo = semAcento($('busca').value);
  const cat = $('categoria').value;
  const soSel = $('soSelecionados').checked;
  const visiveis = produtos.filter(p =>
    (!cat || p.categoria === cat) &&
    (!soSel || estado.quantidades.get(p.codigo) > 0) &&
    (!termo || semAcento(p.produto).includes(termo) || p.codigo === termo));

  if (!visiveis.length) {
    $('listaProdutos').innerHTML = '<tr><td colspan="6" class="vazio">Nenhum produto encontrado.</td></tr>';
    return;
  }
  let html = '', catAtual = null;
  for (const p of visiveis) {
    if (!cat && p.categoria !== catAtual) {
      catAtual = p.categoria;
      html += `<tr class="cat-titulo"><td colspan="6">${esc(catAtual)}</td></tr>`;
    }
    const q = estado.quantidades.get(p.codigo) || 0;
    html += `<tr data-cod="${esc(p.codigo)}" class="${q > 0 ? 'selecionado' : ''}">
      <td class="cod esconder-cel">${esc(p.codigo)}</td>
      <td>${esc(p.produto)}</td>
      <td class="fraco esconder-cel">${esc(p.categoria)}</td>
      <td class="num">${fmt(p.preco)}</td>
      <td class="num">${controleQtd(p, q)}</td>
      <td class="num sub esconder-cel">${q > 0 ? fmt(q * p.preco) : ''}</td>
    </tr>`;
  }
  $('listaProdutos').innerHTML = html;
}

function controleQtd(p, q) {
  return `<span class="qtd">
    <button type="button" data-passo="-1" aria-label="Diminuir">−</button>
    <input type="number" min="0" step="1" inputmode="numeric" value="${q || ''}" placeholder="0" aria-label="Quantidade de ${esc(p.produto)}">
    <button type="button" data-passo="1" aria-label="Aumentar">+</button>
  </span>`;
}

function definirQuantidade(codigo, q) {
  q = Math.max(0, Math.floor(Number(q) || 0));
  if (q > 0) estado.quantidades.set(codigo, q); else estado.quantidades.delete(codigo);

  // Atualiza só a linha alterada da lista de produtos (mantém o foco no campo)
  const tr = $('listaProdutos').querySelector(`tr[data-cod="${CSS.escape(codigo)}"]`);
  if (tr) {
    const p = produtos.find(x => x.codigo === codigo);
    tr.classList.toggle('selecionado', q > 0);
    const inp = tr.querySelector('input');
    if (document.activeElement !== inp) inp.value = q || '';
    tr.querySelector('.sub').textContent = q > 0 ? fmt(q * p.preco) : '';
  }
  atualizarResumos();
}

// Os mesmos controles de quantidade funcionam na tela Produtos e na tela Orçamento
function ligarQuantidades(container, aoMudar) {
  container.addEventListener('click', e => {
    const b = e.target.closest('button[data-passo]');
    if (b) {
      const cod = b.closest('tr').dataset.cod;
      definirQuantidade(cod, (estado.quantidades.get(cod) || 0) + Number(b.dataset.passo));
      if (aoMudar) aoMudar();
    }
  });
  container.addEventListener('input', e => {
    if (e.target.matches('.qtd input')) {
      definirQuantidade(e.target.closest('tr').dataset.cod, e.target.value);
      if (aoMudar) aoMudar(true);
    }
  });
  container.addEventListener('focusout', e => {
    if (e.target.matches('.qtd input')) {
      e.target.value = estado.quantidades.get(e.target.closest('tr').dataset.cod) || '';
      if (aoMudar) aoMudar();
    }
  });
  container.addEventListener('keydown', e => {
    // Enter pula para o campo de quantidade seguinte
    if (e.key === 'Enter' && e.target.matches('.qtd input')) {
      const campos = [...container.querySelectorAll('.qtd input')];
      const prox = campos[campos.indexOf(e.target) + 1];
      if (prox) { prox.focus(); prox.select(); } else e.target.blur();
    }
  });
}
ligarQuantidades($('listaProdutos'));
['busca', 'categoria', 'soSelecionados'].forEach(id => $(id).addEventListener('input', desenharProdutos));

$('arquivoCsv').addEventListener('change', e => {
  const arq = e.target.files[0];
  if (!arq) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const lista = lerProdutos(r.result);
      if (!lista.length) throw new Error('Nenhum produto encontrado no arquivo.');
      carregarProdutos(lista, arq.name);
    } catch (err) { alert('Não foi possível ler o arquivo: ' + err.message); }
  };
  r.readAsText(arq, 'UTF-8');
  e.target.value = '';
});

// ---------- TELA 3: ORÇAMENTO ----------
// digitando: não redesenha a tabela nem reescreve o campo em que o vendedor está digitando
function desenharOrcamento(digitando = false) {
  const o = calcular();

  // Itens
  $('qtdItens').textContent = `· ${o.itens.length} produto(s) · ${o.unidades} unid.`;
  if (!o.itens.length) {
    $('itens').innerHTML = '<div class="vazio">Nenhum produto no orçamento.<br><br><a class="btn primario" href="#produtos">Escolher produtos</a></div>';
  } else if (digitando) {
    // só atualiza os subtotais das linhas
    o.itens.forEach(i => {
      const td = $('itens').querySelector(`tr[data-cod="${CSS.escape(i.codigo)}"] .sub`);
      if (td) td.textContent = fmt(i.sub);
    });
  } else {
    $('itens').innerHTML = `<table>
      <thead><tr><th class="esconder-cel">Cód.</th><th>Produto</th><th class="num">Quantidade</th><th class="num esconder-cel">Preço</th><th class="num">Subtotal</th><th></th></tr></thead>
      <tbody>${o.itens.map(i => `
        <tr data-cod="${esc(i.codigo)}">
          <td class="cod esconder-cel">${esc(i.codigo)}</td>
          <td>${esc(i.produto)}</td>
          <td class="num">${controleQtd(i, i.qtd)}</td>
          <td class="num esconder-cel">${fmt(i.preco)}</td>
          <td class="num sub">${fmt(i.sub)}</td>
          <td style="width:28px"><button class="remover" title="Remover">✕</button></td>
        </tr>`).join('')}</tbody></table>
      <div class="rodape"><a class="link" href="#produtos">+ adicionar produtos</a></div>`;
  }

  // Cliente
  if (document.activeElement !== $('cliente')) $('cliente').value = estado.cliente;
  if (document.activeElement !== $('cidade')) $('cidade').value = estado.cidade;
  $('uf').value = estado.uf;
  if (document.activeElement !== $('vendedor')) $('vendedor').value = estado.vendedor;

  // Desconto
  $('subtotal').textContent = fmt(o.subtotal);
  $('linhaDesconto').hidden = o.pct === 0;
  $('rotuloDesconto').textContent = `Desconto automático (${o.pct}%)`;
  $('valorDesconto').textContent = '− ' + fmt(o.desconto);
  const proxima = [...FAIXAS_DESCONTO].reverse().find(f => o.subtotal <= f.acimaDe);
  if (o.subtotal > 0 && proxima) {
    $('dicaDesconto').textContent = `Faltam ${fmt(centavos(proxima.acimaDe - o.subtotal + 0.01))} em produtos para ${proxima.pct}% de desconto.`;
    $('dicaDesconto').hidden = false;
  } else {
    $('dicaDesconto').hidden = true;
  }

  // Frete
  if (document.activeElement !== $('frete')) $('frete').value = o.frete === null ? '' : o.frete.toFixed(2).replace('.', ',');
  $('origemFrete').textContent = o.freteEditado ? '(alterado)' : `(${o.regra.origem})`;
  $('fretePadrao').hidden = !o.freteEditado || o.regra.valor === null;
  $('frete').classList.toggle('pendente', o.frete === null);
  $('avisoFrete').hidden = o.frete !== null;
  $('avisoFrete').textContent = estado.cidade.trim()
    ? `Sem regra de frete para ${estado.cidade.trim()} - ${estado.uf}: informe o valor.`
    : 'Informe a cidade de entrega para calcular o frete.';

  $('total').innerHTML = fmt(o.total) + (o.frete === null ? '<small>frete a definir</small>' : '');
}

ligarQuantidades($('itens'), digitando => desenharOrcamento(digitando));
$('itens').addEventListener('click', e => {
  if (e.target.closest('.remover')) {
    definirQuantidade(e.target.closest('tr').dataset.cod, 0);
    desenharOrcamento();
  }
});

$('cliente').addEventListener('input', () => {
  const achado = clientes.find(c => semAcento(c.cliente) === semAcento($('cliente').value));
  if (achado) { definirCliente(achado); }
  else { estado.cliente = $('cliente').value; estado.clienteCodigo = null; atualizarResumos(); }
  desenharOrcamento();
});
$('cidade').addEventListener('input', () => {
  estado.cidade = $('cidade').value;
  const uf = ufDaCidade(estado.cidade);
  if (uf) estado.uf = uf;
  estado.freteManual = null;
  atualizarResumos(); desenharOrcamento();
});
$('uf').addEventListener('change', () => { estado.uf = $('uf').value; estado.freteManual = null; atualizarResumos(); desenharOrcamento(); });
$('vendedor').addEventListener('input', () => { estado.vendedor = $('vendedor').value; salvar(); });

$('frete').addEventListener('input', () => {
  const txt = $('frete').value.trim(), v = numeroBR(txt);
  estado.freteManual = txt === '' || isNaN(v) || v < 0 ? null : centavos(v);
  atualizarResumos(); desenharOrcamento(true);
});
$('frete').addEventListener('focusout', () => desenharOrcamento());
$('fretePadrao').addEventListener('click', () => { estado.freteManual = null; atualizarResumos(); desenharOrcamento(); });

$('novoOrcamento').addEventListener('click', () => {
  if ((estado.quantidades.size || estado.cliente) && !confirm('Começar um novo orçamento? O orçamento atual será apagado.')) return;
  estado.quantidades.clear();
  definirCliente(null);
  $('busca').value = ''; $('soSelecionados').checked = false;
  location.hash = '#clientes';
  mostrarTela();
});

// ---------- Impressão / PDF ----------
$('imprimir').addEventListener('click', () => {
  const o = calcular();
  if (!o.itens.length) { alert('Escolha pelo menos um produto.'); return; }

  const cliente = estado.cliente.trim(), cidade = estado.cidade.trim(), vendedor = estado.vendedor.trim();
  const faltando = [];
  if (!cliente) faltando.push('nome do cliente');
  if (!cidade) faltando.push('cidade');
  if (o.frete === null) faltando.push('valor do frete');
  if (faltando.length && !confirm(`Falta informar: ${faltando.join(', ')}.\n\nImprimir mesmo assim?`)) return;

  const hoje = new Date().toLocaleDateString('pt-BR');
  $('impressao').innerHTML = `
    <div class="cab-impressao">
      <img src="${$('logo').src}" alt="">
      <div>
        <div class="empresa">Distribuidora Pantanal</div>
        <div class="subtitulo">Orçamento de venda</div>
      </div>
    </div>
    <table class="dados">
      <tr><td><b>Data:</b> ${hoje}</td><td><b>Vendedor:</b> ${esc(vendedor || '—')}</td></tr>
      <tr><td><b>Cliente:</b> ${esc(cliente || '—')}</td><td><b>Cidade:</b> ${cidade ? esc(cidade) + ' - ' + esc(estado.uf) : '—'}</td></tr>
    </table>
    <table>
      <thead><tr><th>Cód.</th><th>Produto</th><th class="num">Qtd.</th><th class="num">Preço unit.</th><th class="num">Subtotal</th></tr></thead>
      <tbody>
        ${o.itens.map(i => `<tr><td>${esc(i.codigo)}</td><td>${esc(i.produto)}</td><td class="num">${i.qtd}</td><td class="num">${fmt(i.preco)}</td><td class="num">${fmt(i.sub)}</td></tr>`).join('')}
        <tr class="res"><td colspan="4" class="num">Subtotal dos produtos</td><td class="num">${fmt(o.subtotal)}</td></tr>
        ${o.pct > 0 ? `<tr class="res"><td colspan="4" class="num">Desconto (${o.pct}%)</td><td class="num">− ${fmt(o.desconto)}</td></tr>` : ''}
        <tr class="res"><td colspan="4" class="num">Frete</td><td class="num">${o.frete === null ? 'a definir' : o.frete === 0 ? 'Grátis' : fmt(o.frete)}</td></tr>
        <tr class="tot"><td colspan="4" class="num">TOTAL</td><td class="num">${fmt(o.total)}</td></tr>
      </tbody>
    </table>
    <p class="obs">Preços sujeitos a alteração sem aviso prévio.</p>`;

  // O título vira o nome sugerido do arquivo ao salvar em PDF
  const tituloOriginal = document.title;
  document.title = `Orçamento - ${cliente || 'cliente'} - ${hoje.replace(/\//g, '-')}`;
  window.print();
  document.title = tituloOriginal;
});

// ---------- Início ----------
$('dataHoje').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
produtos = lerProdutos(CSV_PRODUTOS);
restaurar();
carregarProdutos(produtos, 'dados/produtos.csv');
mostrarTela();
</script>
</body>
