<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Orçamento — Distribuidora Pantanal</title>
<style>
  :root {
    --navy: #13213c;
    --navy-2: #1f3360;
    --yellow: #f5c518;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1b2333;
    --muted: #64708a;
    --line: #e2e6ee;
    --sel: #fff8dc;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }
  header {
    background: var(--card);
    border-bottom: 4px solid var(--yellow);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  header img { height: 52px; }
  header h1 { margin: 0; font-size: 20px; color: var(--navy); font-weight: 600; }
  header .data { margin-left: auto; color: var(--muted); font-size: 14px; }

  main {
    max-width: 1280px; margin: 0 auto; padding: 20px 24px 40px;
    display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .card h2 { margin: 0; font-size: 16px; color: var(--navy); padding: 14px 16px; border-bottom: 1px solid var(--line); }

  .filtros { display: flex; gap: 10px; padding: 12px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .filtros input, .filtros select, .cliente input {
    font: inherit; padding: 8px 10px; border: 1px solid #c9d0dd; border-radius: 6px; background: #fff; color: var(--text);
  }
  .filtros input { flex: 1 1 220px; }
  .filtros label { white-space: nowrap; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }

  .tabela-wrap { max-height: calc(100vh - 230px); overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: #f8f9fc; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); z-index: 1; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.cod { color: var(--muted); font-variant-numeric: tabular-nums; width: 50px; }
  td.cat { color: var(--muted); font-size: 13px; }
  tr.selecionado td { background: var(--sel); }
  tr.cat-titulo td { background: var(--navy); color: #fff; font-weight: 600; font-size: 13px; padding: 6px 12px; position: static; }

  .qtd { display: inline-flex; align-items: center; border: 1px solid #c9d0dd; border-radius: 6px; overflow: hidden; background: #fff; }
  .qtd button { border: 0; background: #eef1f6; width: 30px; height: 32px; font-size: 18px; cursor: pointer; color: var(--navy); }
  .qtd button:hover { background: #dfe4ee; }
  .qtd input { width: 56px; height: 32px; border: 0; text-align: center; font: inherit; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  .qtd input::-webkit-outer-spin-button, .qtd input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  aside.card { position: sticky; top: 16px; }
  .cliente { padding: 12px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .cliente input { width: 100%; }
  .itens { max-height: calc(100vh - 470px); min-height: 80px; overflow: auto; }
  .itens table td { font-size: 14px; padding: 7px 12px; }
  .itens .remover { border: 0; background: none; color: #b33; cursor: pointer; font-size: 16px; padding: 0 4px; }
  .vazio { padding: 24px 16px; color: var(--muted); text-align: center; }

  .resumo { padding: 12px 16px; display: grid; gap: 6px; }
  .resumo .linha { display: flex; justify-content: space-between; align-items: center; font-variant-numeric: tabular-nums; }
  .resumo .linha input { width: 80px; font: inherit; padding: 4px 6px; border: 1px solid #c9d0dd; border-radius: 6px; text-align: right; }
  .total { background: var(--navy); color: #fff; padding: 16px; display: flex; justify-content: space-between; align-items: baseline; border-radius: 0 0 10px 10px; }
  .total span:first-child { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; }
  .total strong { font-size: 28px; color: var(--yellow); font-variant-numeric: tabular-nums; }
  .acoes { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .btn { flex: 1; font: inherit; padding: 9px 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--navy); background: #fff; color: var(--navy); font-weight: 600; }
  .btn.primario { background: var(--yellow); border-color: var(--yellow); color: var(--navy); }
  .btn:hover { filter: brightness(.95); }

  .rodape { color: var(--muted); font-size: 12px; padding: 10px 16px; }
  .rodape label { color: var(--navy-2); text-decoration: underline; cursor: pointer; }

  /* Bloco usado só na impressão */
  #impressao { display: none; }

  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    header { padding: 10px 16px; }
    header .data { margin-left: 0; width: 100%; }
    .filtros select { flex: 1 1 100%; }
    th, td { padding: 8px 6px; }
    .tabela-wrap td.cod, .tabela-wrap th:first-child, .tabela-wrap td.sub, .tabela-wrap th:last-child { display: none; }
    .qtd input { width: 44px; }
    aside.card { position: static; }
    .tabela-wrap, .itens { max-height: none; }
    td.cat, th.cat { display: none; }
  }

  @media print {
    body { background: #fff; }
    header, main { display: none !important; }
    #impressao { display: block; padding: 0 8px; font-size: 13px; }
    #impressao img { height: 60px; }
    #impressao h2 { margin: 12px 0 4px; color: var(--navy); }
    #impressao table th { position: static; background: #eee; color: #000; }
    #impressao .tot td { font-weight: 700; font-size: 15px; border-top: 2px solid #000; }
    @page { margin: 15mm; }
  }
</style>
</head>

const moeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = v => moeda.format(v);

// ---------- Leitura do CSV ----------
function lerCsv(texto) {
  const linhas = texto.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim() !== '');
  const cab = linhas.shift().split(';').map(c => c.trim().toLowerCase());
  const idx = nome => cab.indexOf(nome);
  const iCod = idx('codigo'), iProd = idx('produto'), iCat = idx('categoria'), iPreco = idx('preco');
  if ([iCod, iProd, iCat, iPreco].includes(-1)) {
    throw new Error('O arquivo precisa ter as colunas: codigo;produto;categoria;preco');
  }
  return linhas.map(l => {
    const c = l.split(';');
    // "1.234,56" -> 1234.56
    const preco = parseFloat(c[iPreco].trim().replace(/\./g, '').replace(',', '.'));
    return { codigo: c[iCod].trim(), produto: c[iProd].trim(), categoria: c[iCat].trim(), preco };
  }).filter(p => p.produto && !isNaN(p.preco));
}

// ---------- Estado ----------
let produtos = [];
const quantidades = new Map(); // codigo -> quantidade

const $ = id => document.getElementById(id);
const el = {
  lista: $('listaProdutos'), busca: $('busca'), categoria: $('categoria'), soSel: $('soSelecionados'),
  itens: $('itens'), qtdItens: $('qtdItens'), subtotal: $('subtotal'), desconto: $('desconto'),
  linhaDesconto: $('linhaDesconto'), valorDesconto: $('valorDesconto'), total: $('total'), info: $('infoLista'),
};

function carregarProdutos(lista, origem) {
  produtos = lista;
  quantidades.clear();
  const cats = [...new Set(produtos.map(p => p.categoria))];
  el.categoria.innerHTML = '<option value="">Todas as categorias</option>' +
    cats.map(c => `<option>${esc(c)}</option>`).join('');
  el.info.textContent = `${produtos.length} produtos (${origem})`;
  desenharLista();
  atualizarOrcamento();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function semAcento(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

// ---------- Lista de produtos ----------
function desenharLista() {
  const termo = semAcento(el.busca.value.trim());
  const cat = el.categoria.value;
  const soSel = el.soSel.checked;

  const visiveis = produtos.filter(p =>
    (!cat || p.categoria === cat) &&
    (!soSel || quantidades.get(p.codigo) > 0) &&
    (!termo || semAcento(p.produto).includes(termo) || p.codigo === termo)
  );

  if (!visiveis.length) {
    el.lista.innerHTML = '<tr><td colspan="6" class="vazio">Nenhum produto encontrado.</td></tr>';
    return;
  }

  let html = '', catAtual = null;
  for (const p of visiveis) {
    if (!cat && p.categoria !== catAtual) {
      catAtual = p.categoria;
      html += `<tr class="cat-titulo"><td colspan="6">${esc(catAtual)}</td></tr>`;
    }
    const q = quantidades.get(p.codigo) || 0;
    html += `<tr data-cod="${esc(p.codigo)}" class="${q > 0 ? 'selecionado' : ''}">
      <td class="cod">${esc(p.codigo)}</td>
      <td>${esc(p.produto)}</td>
      <td class="cat">${esc(p.categoria)}</td>
      <td class="num">${fmt(p.preco)}</td>
      <td class="num"><span class="qtd">
        <button type="button" data-passo="-1" aria-label="Diminuir">−</button>
        <input type="number" min="0" step="1" inputmode="numeric" value="${q || ''}" placeholder="0" aria-label="Quantidade de ${esc(p.produto)}">
        <button type="button" data-passo="1" aria-label="Aumentar">+</button>
      </span></td>
      <td class="num sub">${q > 0 ? fmt(q * p.preco) : ''}</td>
    </tr>`;
  }
  el.lista.innerHTML = html;
}

function definirQuantidade(codigo, q) {
  q = Math.max(0, Math.floor(Number(q) || 0));
  if (q > 0) quantidades.set(codigo, q); else quantidades.delete(codigo);

  // Atualiza só a linha alterada, sem redesenhar (mantém o foco no campo)
  const tr = el.lista.querySelector(`tr[data-cod="${CSS.escape(codigo)}"]`);
  if (tr) {
    const p = produtos.find(x => x.codigo === codigo);
    tr.classList.toggle('selecionado', q > 0);
    const inp = tr.querySelector('input');
    if (document.activeElement !== inp) inp.value = q || '';
    tr.querySelector('.sub').textContent = q > 0 ? fmt(q * p.preco) : '';
  }
  atualizarOrcamento();
}

el.lista.addEventListener('click', e => {
  const b = e.target.closest('button[data-passo]');
  if (!b) return;
  const cod = b.closest('tr').dataset.cod;
  definirQuantidade(cod, (quantidades.get(cod) || 0) + Number(b.dataset.passo));
});
el.lista.addEventListener('input', e => {
  if (e.target.matches('input')) definirQuantidade(e.target.closest('tr').dataset.cod, e.target.value);
});
el.lista.addEventListener('focusout', e => {
  if (e.target.matches('input')) e.target.value = quantidades.get(e.target.closest('tr').dataset.cod) || '';
});
el.lista.addEventListener('keydown', e => {
  // Enter pula para o campo de quantidade seguinte
  if (e.key === 'Enter' && e.target.matches('input')) {
    const campos = [...el.lista.querySelectorAll('input')];
    const prox = campos[campos.indexOf(e.target) + 1];
    if (prox) { prox.focus(); prox.select(); }
  }
});

[el.busca, el.categoria, el.soSel].forEach(c => c.addEventListener('input', desenharLista));

// ---------- Orçamento ----------
function calcular() {
  const itens = produtos
    .filter(p => quantidades.get(p.codigo) > 0)
    .map(p => ({ ...p, qtd: quantidades.get(p.codigo), sub: quantidades.get(p.codigo) * p.preco }));
  const subtotal = itens.reduce((s, i) => s + i.sub, 0);
  const pct = Math.min(100, Math.max(0, parseFloat(el.desconto.value) || 0));
  const desconto = Math.round(subtotal * pct) / 100;
  return { itens, subtotal, pct, desconto, total: subtotal - desconto };
}

function atualizarOrcamento() {
  const o = calcular();
  if (!o.itens.length) {
    el.itens.innerHTML = '<div class="vazio">Nenhum produto escolhido ainda.<br>Informe as quantidades na lista ao lado.</div>';
  } else {
    el.itens.innerHTML = '<table><tbody>' + o.itens.map(i => `
      <tr data-cod="${esc(i.codigo)}">
        <td>${esc(i.produto)}<br><small style="color:var(--muted)">${i.qtd} × ${fmt(i.preco)}</small></td>
        <td class="num">${fmt(i.sub)}</td>
        <td style="width:28px"><button class="remover" title="Remover">✕</button></td>
      </tr>`).join('') + '</tbody></table>';
  }
  el.qtdItens.textContent = `${o.itens.length} produto(s) · ${o.itens.reduce((s, i) => s + i.qtd, 0)} unid.`;
  el.subtotal.textContent = fmt(o.subtotal);
  el.linhaDesconto.hidden = !(o.pct > 0);
  el.valorDesconto.textContent = '− ' + fmt(o.desconto);
  el.total.textContent = fmt(o.total);
}

el.itens.addEventListener('click', e => {
  if (e.target.closest('.remover')) {
    definirQuantidade(e.target.closest('tr').dataset.cod, 0);
    if (el.soSel.checked) desenharLista();
  }
});
el.desconto.addEventListener('input', atualizarOrcamento);

$('limpar').addEventListener('click', () => {
  if (quantidades.size && !confirm('Limpar todas as quantidades do orçamento?')) return;
  quantidades.clear();
  el.desconto.value = 0;
  desenharLista();
  atualizarOrcamento();
});

// ---------- Impressão ----------
$('imprimir').addEventListener('click', () => {
  const o = calcular();
  if (!o.itens.length) { alert('Escolha pelo menos um produto.'); return; }
  const cliente = $('cliente').value.trim(), vendedor = $('vendedor').value.trim();
  $('impressao').innerHTML = `
    <img src="${document.querySelector('header img').src}" alt="">
    <h2>Orçamento</h2>
    <p>Data: ${new Date().toLocaleDateString('pt-BR')}
      ${cliente ? `<br>Cliente: ${esc(cliente)}` : ''}
      ${vendedor ? `<br>Vendedor: ${esc(vendedor)}` : ''}</p>
    <table>
      <thead><tr><th>Cód.</th><th>Produto</th><th class="num">Qtd.</th><th class="num">Preço unit.</th><th class="num">Subtotal</th></tr></thead>
      <tbody>
        ${o.itens.map(i => `<tr><td>${esc(i.codigo)}</td><td>${esc(i.produto)}</td><td class="num">${i.qtd}</td><td class="num">${fmt(i.preco)}</td><td class="num">${fmt(i.sub)}</td></tr>`).join('')}
        ${o.pct > 0 ? `
          <tr><td colspan="4" class="num">Subtotal</td><td class="num">${fmt(o.subtotal)}</td></tr>
          <tr><td colspan="4" class="num">Desconto (${String(o.pct).replace('.', ',')}%)</td><td class="num">− ${fmt(o.desconto)}</td></tr>` : ''}
        <tr class="tot"><td colspan="4" class="num">TOTAL</td><td class="num">${fmt(o.total)}</td></tr>
      </tbody>
    </table>`;
  window.print();
});

// ---------- Carregar outro CSV ----------
$('arquivoCsv').addEventListener('change', e => {
  const arq = e.target.files[0];
  if (!arq) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const lista = lerCsv(r.result);
      if (!lista.length) throw new Error('Nenhum produto encontrado no arquivo.');
      carregarProdutos(lista, arq.name);
    } catch (err) { alert('Não foi possível ler o arquivo: ' + err.message); }
  };
  r.readAsText(arq, 'UTF-8');
  e.target.value = '';
});

// ---------- Início ----------
$('dataHoje').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
carregarProdutos(lerCsv(CSV_PRODUTOS), 'dados/produtos.csv');
</script>
</body>
</html>
